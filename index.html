    <meta property="og:title" content="AI Sorix - Your AI Assistant" />

    <!-- Prevent FOUC (Flash of Unstyled Content) - Apply theme BEFORE React loads -->
    <script>
      (function() {
        try {
          // Try to get theme from Zustand persist storage first
          var stored = localStorage.getItem('chat-storage');
          var theme = 'dark'; // Default to dark
          
          if (stored) {
            var parsed = JSON.parse(stored);
            if (parsed.state && parsed.state.theme) {
              theme = parsed.state.theme;
            }
          }
          
          // Also check legacy theme storage
          var legacyTheme = localStorage.getItem('theme');
          if (legacyTheme === 'system') {
            theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          } else if (legacyTheme === 'light' || legacyTheme === 'dark') {
            theme = legacyTheme;
          }
          
          // Apply theme class immediately
          document.documentElement.classList.remove('light', 'dark');
          document.documentElement.classList.add(theme);
          
          // Set color-scheme for native elements
          document.documentElement.style.colorScheme = theme;
        } catch (e) {
          // Fallback to dark theme on error
          document.documentElement.classList.add('dark');
          document.documentElement.style.colorScheme = 'dark';
        }
      })();
    </script>
    
    <!-- Prevent layout shift -->
    <style>
      html, body, #root {
        min-height: 100%;
        margin: 0;
        padding: 0;
      }
      /* Initial loading state - prevents flash */
      #root:empty {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        background: hsl(220 25% 6%);
      }
      .dark #root:empty {
        background: hsl(220 25% 6%);
      }
      .light #root:empty {
        background: hsl(220 20% 98%);
      }
    </style>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
